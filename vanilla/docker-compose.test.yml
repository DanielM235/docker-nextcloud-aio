# Test overlay for Nextcloud (vanilla)
#
# Extends docker-compose.yml to add an nginx container mirroring the
# production host setup, and a pytest test-runner (host networking so it can
# reach the app's loopback port).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     run --rm --build test-runner

services:

  nginx-test:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx-test
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/nextcloud.conf.template:/etc/nginx/templates/nextcloud.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      # Throwaway self-signed test certificates (see tests/certs/README.md).
      - ./tests/certs/test.crt:/etc/nginx/ssl/test.crt:ro
      - ./tests/certs/test.key:/etc/nginx/ssl/test.key:ro
      - ./tests/certs/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
    environment:
      NGINX_SERVER_NAME: ${DOMAIN_NAME:-nextcloud.example.com}
      NGINX_APP_PORT: ${APP_HTTP_PORT:-8080}
      NGINX_SSL_CERT: /etc/nginx/ssl/test.crt
      NGINX_SSL_KEY: /etc/nginx/ssl/test.key
      NGINX_DHPARAM: /etc/nginx/ssl/dhparam.pem
    ports:
      - "127.0.0.1:${NGINX_TEST_PORT:-9080}:80"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 \"$(cat /var/run/nginx.pid)\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  test-runner:
    build:
      context: ./tests
      dockerfile: Dockerfile.test
    container_name: ${COMPOSE_PROJECT_NAME}-test-runner
    network_mode: host
    volumes:
      - ./:/project:ro
      - ../:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8080}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nextcloud-vanilla}
      TEST_TIMEOUT: ${TEST_TIMEOUT:-180}
      TEST_RETRY_INTERVAL: ${TEST_RETRY_INTERVAL:-5}
    depends_on:
      app:
        condition: service_started
      nginx-test:
        condition: service_healthy
    restart: "no"

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-nextcloud-vanilla}-internal
    driver: bridge

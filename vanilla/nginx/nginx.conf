# Main nginx configuration
#
# For the TEST container — mounted at /etc/nginx/nginx.conf
# For PRODUCTION on Debian 12 / Ubuntu 24.04 — use as a reference, or
# include from your existing nginx.conf.
#
# The server block in nginx/templates/ is processed by envsubst at
# container start-up (or manually for production) and placed in conf.d/.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # Upload size — Nextcloud needs large uploads; the limit itself is
    # governed by PHP_UPLOAD_LIMIT.  0 = unlimited.
    client_max_body_size 0;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}

# Test overlay for Nextcloud AIO
#
# Extends docker-compose.yml to add:
#   1. An nginx container that mirrors the production host setup and mounts
#      the same nginx.conf + templates (with throwaway test certificates).
#   2. A pytest-based test-runner container (host networking so it can reach
#      the mastercontainer's AIO interface on 127.0.0.1).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     run --rm --build test-runner
#
# This is a "light" suite: it does not attempt a full Nextcloud bootstrap.

services:

  # ----------------------------------------------------------
  # nginx-test — mirrors the system nginx on the host
  #
  # In production, nginx is installed at the OS level.  Here we run the
  # same nginx.conf and templates inside a container so the test suite
  # verifies that they render and load correctly.  The upstream services
  # are not reachable in this light suite, so nginx serves 502 — that is
  # expected and proves the proxy layer itself is up.
  # ----------------------------------------------------------
  nginx-test:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx-test
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/nextcloud.conf.template:/etc/nginx/templates/nextcloud.conf.template:ro
      - ./nginx/templates/aio-admin.conf.template:/etc/nginx/templates/aio-admin.conf.template:ro
      # Suppress the default server block that ships with the nginx image.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      # Throwaway self-signed test certificates (see tests/certs/README.md).
      - ./tests/certs/test.crt:/etc/nginx/ssl/test.crt:ro
      - ./tests/certs/test.key:/etc/nginx/ssl/test.key:ro
      - ./tests/certs/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
    environment:
      # Values expanded inside the templates by nginx's envsubst mechanism.
      NGINX_SERVER_NAME: ${DOMAIN_NAME:-nextcloud.example.com}
      NGINX_APACHE_PORT: ${APACHE_PORT:-11000}
      NGINX_SSL_CERT: /etc/nginx/ssl/test.crt
      NGINX_SSL_KEY: /etc/nginx/ssl/test.key
      NGINX_DHPARAM: /etc/nginx/ssl/dhparam.pem
      NGINX_AIO_HOSTNAME: ${AIO_ADMIN_HOSTNAME:-aio.example.com}
      NGINX_AIO_PORT: ${AIO_INTERFACE_PORT:-8080}
    ports:
      - "127.0.0.1:${NGINX_TEST_PORT:-9080}:80"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      # nginx writes its master PID to /var/run/nginx.pid (see nginx.conf).
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 \"$(cat /var/run/nginx.pid)\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  # ----------------------------------------------------------
  # test-runner — pytest inside Docker
  #
  # Uses host networking so it can reach the mastercontainer's published
  # AIO interface on 127.0.0.1, and mounts the Docker socket so it can
  # inspect container state.
  # ----------------------------------------------------------
  test-runner:
    build:
      context: ./tests
      dockerfile: Dockerfile.test
    container_name: ${COMPOSE_PROJECT_NAME}-test-runner
    network_mode: host
    volumes:
      - ./:/project:ro
      - ../:/repo:ro
      # Read-only: the tests only inspect container state via the Docker SDK.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      AIO_INTERFACE_PORT: ${AIO_INTERFACE_PORT:-8080}
      AIO_MASTER_CONTAINER: nextcloud-aio-mastercontainer
      NGINX_TEST_CONTAINER: ${COMPOSE_PROJECT_NAME}-nginx-test
      TEST_TIMEOUT: ${TEST_TIMEOUT:-180}
      TEST_RETRY_INTERVAL: ${TEST_RETRY_INTERVAL:-5}
    depends_on:
      nextcloud-aio-mastercontainer:
        condition: service_started
      nginx-test:
        condition: service_healthy
    restart: "no"

networks:
  backend:
    driver: bridge
